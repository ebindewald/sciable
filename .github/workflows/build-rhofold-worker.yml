# Build the RhoFold+ Runpod Serverless worker image (worker/Dockerfile.rhofold) on
# GitHub Actions and push it to GHCR. RhoFold cannot use Runpod's root-Dockerfile
# auto-detect (that slot is structRFM's), so GHA-builds-then-Runpod-pulls is the way.
#
# After the first successful run:
#   1. github.com/<owner>?tab=packages -> rhofold-worker -> Package settings
#      -> Change visibility -> Public (Runpod then pulls it without credentials).
#      Or keep private + add a GHCR credential in Runpod (Settings -> Container
#      Registry Auth; username = GitHub user, password = PAT with read:packages).
#   2. In Runpod, create the Serverless endpoint from ghcr.io/<owner>/rhofold-worker
#      (the sha-* tag), 0 min / 1 max workers.
#   3. Copy the digest printed at the end of the job into
#      methods/rhofold/manifest.json (worker_image_digest).

name: Build RhoFold worker image

on:
  push:
    branches: [main]
    paths:
      - worker/Dockerfile.rhofold
      - worker/requirements-rhofold.txt
      - worker/run_rhofold.py
      - worker/handler.py
      - worker/serverless_entry.py
      - .github/workflows/build-rhofold-worker.yml
  workflow_dispatch:
    inputs:
      rhofold_commit:
        description: "Upstream ml4bio/RhoFold commit to pin (default: main)"
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: build-rhofold-worker
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The pytorch/cuda base + deps + checkpoint come to several GB; free space on
      # the stock runner (~14 GB) before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Set image name (GHCR requires lowercase)
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/rhofold-worker" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile.rhofold
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            RHOFOLD_COMMIT=${{ github.event.inputs.rhofold_commit || 'main' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}

      - name: Print image reference and digest
        run: |
          echo "## RhoFold worker image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image:  ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
          echo "digest: ${{ steps.build.outputs.digest }}"
