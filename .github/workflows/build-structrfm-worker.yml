# Build the structRFM Runpod Serverless worker image (root Dockerfile) on GitHub
# Actions and push it to GHCR. This sidesteps Runpod's GitHub image builder
# (which can fail with an empty build log) and does not need a local Docker.
#
# After the first successful run:
#   1. github.com/<owner>?tab=packages -> structrfm-worker -> Package settings
#      -> Change visibility -> Public (Runpod then pulls it without credentials).
#      Or keep it private and add a GHCR registry credential in Runpod
#      (Settings -> Container Registry Auth; username = GitHub user, password =
#      a PAT with read:packages).
#   2. In Runpod, create the Serverless endpoint from the image
#      ghcr.io/<owner>/structrfm-worker:latest  (or the sha-* tag).
#   3. Copy the digest printed at the end of the job into
#      methods/structrfm/manifest.json (worker_image_digest).

name: Build structRFM worker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - worker/**
      - .github/workflows/build-structrfm-worker.yml
  workflow_dispatch:
    inputs:
      structrfm_release:
        description: "structRFM GitHub release tag for the checkpoint (default: latest)"
        required: false
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: build-structrfm-worker
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The pytorch/cuda base image plus pip deps and the checkpoint come to
      # several GB; the stock runner has ~14 GB free, so drop the preinstalled
      # toolchains we don't need before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Set image name (GHCR requires lowercase)
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/structrfm-worker" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            STRUCTRFM_RELEASE=${{ github.event.inputs.structrfm_release || 'latest' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}

      - name: Print image reference and digest
        run: |
          echo "## structRFM worker image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image:  ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
          echo "digest: ${{ steps.build.outputs.digest }}"
